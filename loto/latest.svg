      <stop offset="1" stop-color="#d8eeeb"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#087a91"/>
      <stop offset="1" stop-color="#064e69"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#07394a" flood-opacity="0.14"/>
    </filter>
  </defs>

